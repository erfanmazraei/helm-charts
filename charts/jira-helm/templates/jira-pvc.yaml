{{- if and .Values.jira.enabled .Values.jira.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "jira-helm.fullname" . }}-jira-pvc
  labels:
    {{- include "jira-helm.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.jira.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.jira.persistence.size }}
  {{- if .Values.jira.persistence.storageClass }}
  storageClassName: {{ .Values.jira.persistence.storageClass | quote }}
  {{- end }}
{{- end }}